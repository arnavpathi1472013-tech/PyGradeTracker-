<!DOCTYPE html>
<html>
<head>
    <title>Grade Feedback System</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2023.05.1/pyscript.css" />
    <script defer src="https://pyscript.net/releases/2023.05.1/pyscript.js"></script>

    <py-config>
        files = ["main.py"]
    </py-config>
</head>
<body>
    <h2>Grade Feedback System</h2>

    <label>Enter marks obtained (out of 60):</label><br>
    <input type="number" id="marksInput"><br><br>

    <button py-click="check_grade()">Calculate Grade</button>

    <h3>Result:</h3>
    <div id="outputDiv"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
